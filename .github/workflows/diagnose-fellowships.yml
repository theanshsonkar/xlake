name: Diagnose fellowships

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fellowship collector uses only Python's standard library; no pip dependencies are required.
      - name: Run fellowship diagnostics in an isolated engine copy
        run: |
          cp -R engine "$RUNNER_TEMP/opportunity-lake-engine"
          cd "$RUNNER_TEMP/opportunity-lake-engine"
          python3 -u -m categories.fellowships.fellowships
