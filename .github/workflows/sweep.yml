name: sweep

# The collector runs on GitHub's hardware, not on a laptop. Free tier is 2,000
# minutes/month for private repos; one daily sweep plus one daily
# page-reader pass must stay comfortably inside that.
#
# GitHub only reads workflows from the repo ROOT (.github/workflows/). The
# archived legacy workflow, if needed for historical comparison, is preserved
# under archive/opportunity-lake-oldengine-2026-08-16/ and is not active.
on:
  schedule:
    - cron: "0 1 * * *"     # 06:30 IST — the board sweep, once daily
    - cron: "30 2 * * *"    # 08:00 IST — the page-reader pass, once daily
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually (sweep | read_pages | both)"
        required: false
        default: "both"
      limit:
        description: "LAKE_LIMIT for a manual run (0 = all)"
        required: false
        default: "0"

concurrency:
  group: sweep-${{ github.ref }}
  cancel-in-progress: false

# Both jobs commit data/*.json back to the repo, so they need write access.
permissions:
  contents: write

jobs:
  sweep:
    if: >
      (github.event_name == 'schedule' &&
       github.event.schedule == '0 1 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'sweep' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_DEFAULT_REGION: ap-south-1
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The registry is small and company-scoped (data/operations/registry.json,
      # built by resolve_companies.py), not the raw Common Crawl universe, so
      # there is no enumeration-cache step here.
      - name: Refresh community internship lists (zshah101)
        run: python3 -u -m categories.internships.lists

      # The canonical lake lives in S3, not git. Pull the current lake down so
      # the collectors read/write the same local files exactly as before.
      - name: Restore lake from S3
        run: |
          mkdir -p data/lake
          aws s3 cp "s3://$AWS_S3_BUCKET/lake/opportunities.json" data/lake/opportunities.json
          aws s3 cp "s3://$AWS_S3_BUCKET/lake/hidden.json" data/lake/hidden.json
          aws s3 cp "s3://$AWS_S3_BUCKET/lake/opportunities_history.json" data/lake/opportunities_history.json

      - name: Sweep the resolved registry
        env:
          LAKE_WORKERS: "8"
          LAKE_HOST_DELAY: "0.3"
          LAKE_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python3 -u -m pipeline.sweep

      - name: Show report
        run: tail -1 data/operations/runs.jsonl | python3 -m json.tool

      - name: Refresh Open Source programmes
        run: python3 -u -m categories.open_source.programmes

      - name: Refresh Open Source contributions (good-first-issues)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: python3 -u -m categories.open_source.contributions

      - name: Refresh Fellowships
        run: |
          python3 -u -m categories.fellowships.fellowships
          python3 -u -m categories.fellowships.fellowships --apply-verifications

      - name: Refresh Hackathons
        run: python3 -u -m categories.hackathons.hackathons

      # Persist the lake back to S3 after ALL collectors have written it, so no
      # record type is lost, plus a timestamped snapshot for point-in-time
      # recovery. Placed after the last collector (not right after the sweep)
      # because programmes/contributions/hackathons also write the lake.
      - name: Sync lake to S3
        run: |
          aws s3 cp data/lake/opportunities.json "s3://$AWS_S3_BUCKET/lake/opportunities.json"
          aws s3 cp data/lake/hidden.json "s3://$AWS_S3_BUCKET/lake/hidden.json"
          aws s3 cp data/lake/opportunities_history.json "s3://$AWS_S3_BUCKET/lake/opportunities_history.json"
          aws s3 cp data/lake/opportunities.json "s3://$AWS_S3_BUCKET/archive/opportunities-$(date -u +%Y%m%dT%H%M%SZ).json"

      # Publish the serving rows (is_live OR needs_confirmation) into the
      # Supabase serving table. Read-only against the lake; upserts on id and
      # soft-retires ids no longer serving. Uses the Python stdlib only
      # (urllib/json/hashlib) — no extra pip deps required.
      - name: Publish to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 -u -m pipeline.publish_supabase --execute

      # opportunities.json is the canonical lake. hidden.json is its retained
      # non-default companion; run and tier state are operational history.
      # The lake files themselves now live in S3 (synced above) and are
      # gitignored, so only the small operational files are committed here.
      - name: Commit operational files
        run: |
          git config user.name  "opportunity-lake-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/operations/registry.json \
            data/operations/runs.jsonl data/operations/tier_state.json \
            data/operations/programmes_observations.json \
            data/operations/programme_verifications.json \
            data/operations/research_programme_verifications.json \
            data/operations/discovery_*.json
          git diff --staged --quiet || git commit -m "daily: sweep + programmes + contributions $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-output
          path: |
            engine/data/lake/opportunities.json
            engine/data/lake/hidden.json
            engine/data/operations/runs.jsonl
            engine/data/operations/tier_state.json
          retention-days: 14

  read_pages:
    needs: sweep
    if: >
      always() &&
      (needs.sweep.result == 'success' || needs.sweep.result == 'skipped') &&
      (
        (github.event_name == 'schedule' &&
         github.event.schedule == '30 2 * * *') ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.job == 'read_pages' || github.event.inputs.job == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # read_pages.py is mechanism 2 (the AI page reader) — see adapters/extractors.py.
      # It needs an LLM configured via XLAKE_LLM_API_KEY / XLAKE_LLM_MODEL /
      # XLAKE_LLM_ENDPOINT. None of those secrets exist in this repo yet
      # (engine currently runs in fixture/test mode only, per README.md), so
      # this job is wired up and scheduled but will no-op or fall back to
      # fixtures until those secrets are added — that is expected, not a bug.
      - name: Read queued company pages
        env:
          LAKE_LIMIT: ${{ github.event.inputs.limit || '0' }}
          XLAKE_LLM_API_KEY: ${{ secrets.XLAKE_LLM_API_KEY }}
          XLAKE_LLM_MODEL: ${{ secrets.XLAKE_LLM_MODEL }}
          XLAKE_LLM_ENDPOINT: ${{ secrets.XLAKE_LLM_ENDPOINT }}
        run: |
          if [ -z "$XLAKE_LLM_API_KEY" ]; then
            echo "no XLAKE_LLM_API_KEY secret set — page reader has no model configured, skipping run"
            exit 0
          fi
          python3 -u -m pipeline.read_pages

      - name: Commit page-reader state
        run: |
          git config user.name  "opportunity-lake-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/operations/pagereader_rows.json data/operations/pagereader_state.json
          git diff --staged --quiet || git commit -m "read_pages: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
