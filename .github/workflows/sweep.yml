name: sweep

# Jobs + internships are swept as a MATRIX BY ATS PLATFORM. Each leg restores
# only its own shard (lake/shards/jobs-<platform>.json + .hidden.json), sweeps
# only that platform's registry boards, writes the shard back and publishes
# only that shard to Supabase (scoped soft-retire). Legs run in parallel with a
# 30 minute cap each (the old single job took ~60 min of a 90 min cap).
#
# Manual "run all" = workflow_dispatch with platform=all (the default).
# Schedule: the daily 06:47 IST run sweeps every leg; the page-reader pass is
# the separate second schedule.
#
# GitHub only reads workflows from the repo ROOT (.github/workflows/). The
# archived legacy workflow lives under archive/opportunity-lake-oldengine-2026-08-16/.
on:
  schedule:
    - cron: "17 1 * * *"     # 06:47 IST - the board sweep, once daily
    - cron: "37 2 * * *"    # 08:07 IST - the page-reader pass, once daily
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually (sweep | read_pages | both)"
        required: false
        default: "both"
      platform:
        description: "Sweep leg: all | greenhouse | lever | ashby | workable | workday | keka | other | internships"
        required: false
        default: "all"
      limit:
        description: "LAKE_LIMIT for a manual run (0 = all)"
        required: false
        default: "0"
      dry_run:
        description: "Sweep only: no S3 write, no publish, no operational commit"
        required: false
        type: boolean
        default: false
      retire_force:
        description: "Comma-separated legs (e.g. workable,other) or 'all' allowed to bypass the drop + retire guards"
        required: false
        default: ""

concurrency:
  group: xlake-lake-writer
  cancel-in-progress: false

# Operational files are committed back to the repo, so write access is needed.
permissions:
  contents: write

jobs:
  plan:
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'sweep' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          ALL='["greenhouse","lever","ashby","workable","workday","keka","other","internships"]'
          P="${{ github.event.inputs.platform }}"
          if [ -z "$P" ] || [ "$P" = "all" ]; then
            echo "matrix={\"platform\":$ALL}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"platform\":[\"$P\"]}" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: xlake-jobs-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      P: ${{ matrix.platform }}
      SHARD: jobs-${{ matrix.platform }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      XLAKE_RETIRE_FORCE: ${{ github.event.inputs.retire_force }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_DEFAULT_REGION: ap-south-1
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore ONLY this leg's shard. If it does not exist yet (first run
      # after the rollout) it is derived once from the full lake; run the
      # migrate-shards workflow first to create every shard at once.
      - name: Restore shard from S3
        run: |
          mkdir -p data/lake/shards
          KEY="lake/shards/$SHARD.json"
          if aws s3api head-object --bucket "$AWS_S3_BUCKET" --key "$KEY" >/dev/null 2>head.err; then
            aws s3 cp "s3://$AWS_S3_BUCKET/$KEY" "data/lake/shards/$SHARD.json"
            aws s3 cp "s3://$AWS_S3_BUCKET/lake/shards/$SHARD.hidden.json" "data/lake/shards/$SHARD.hidden.json" || echo "no hidden companion yet"
            python3 -m pipeline.shard_run stage --category "$SHARD"
          elif grep -qE "404|Not Found" head.err; then
            echo "::warning::shard $SHARD missing in S3 - deriving once from the full lake"
            aws s3 cp "s3://$AWS_S3_BUCKET/lake/opportunities.json" data/lake/opportunities.json
            aws s3 cp "s3://$AWS_S3_BUCKET/lake/hidden.json" data/lake/hidden.json || echo "[]" > data/lake/hidden.json
            python3 -m pipeline.shard_run stage --category "$SHARD" --from-full
          else
            cat head.err; exit 1
          fi

      - name: Refresh community internship lists (zshah101)
        if: ${{ matrix.platform == 'internships' }}
        run: python3 -u -m categories.internships.lists

      - name: Sweep this platform's registry boards
        env:
          LAKE_WORKERS: "8"
          LAKE_HOST_DELAY: "0.3"
          LAKE_LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python3 -u -m pipeline.sweep --shard "$SHARD"

      - name: Show report
        run: tail -1 data/operations/runs.jsonl | python3 -m json.tool

      # Row-drop guard (>50%), keep only this shard's rows, step summary with
      # description / employment_type / workplace / salary / posted_at /
      # company_domain / level coverage and duplicate counts.
      - name: Finalize shard + summary
        run: |
          FORCE=""
          case ",$(echo "$XLAKE_RETIRE_FORCE" | tr -d ' ')," in
            *",$P,"*|*",$SHARD,"*|*",all,"*) FORCE="--force" ;;
          esac
          python3 -m pipeline.shard_run finalize --category "$SHARD" $FORCE

      - name: Write shard to S3
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          aws s3 cp "data/lake/shards/$SHARD.json" "s3://$AWS_S3_BUCKET/lake/shards/$SHARD.json"
          [ -f "data/lake/shards/$SHARD.hidden.json" ] && aws s3 cp "data/lake/shards/$SHARD.hidden.json" "s3://$AWS_S3_BUCKET/lake/shards/$SHARD.hidden.json"
          aws s3 cp "data/lake/shards/$SHARD.json" "s3://$AWS_S3_BUCKET/archive/shards/$SHARD-$(date -u +%Y%m%dT%H%M%SZ).json"

      - name: Publish to Supabase (scoped to this shard)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          EXTRA=""
          case ",$(echo "$XLAKE_RETIRE_FORCE" | tr -d ' ')," in
            *",$P,"*|*",$SHARD,"*|*",all,"*) EXTRA="--force-retire" ;;
          esac
          if [ "$DRY_RUN" = "true" ]; then
            python3 -u -m pipeline.publish_supabase --category "$SHARD" | tail -25
          else
            python3 -u -m pipeline.publish_supabase --category "$SHARD" --execute $EXTRA
          fi

      # Operational files are merged and committed once, by the commit_ops job.
      - name: Upload operational outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ops-${{ matrix.platform }}
          path: |
            engine/data/operations/runs.jsonl
            engine/data/operations/tier_state.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.platform }}
          path: |
            engine/data/lake/shards/jobs-${{ matrix.platform }}.json
            engine/data/lake/shards/jobs-${{ matrix.platform }}.hidden.json
          retention-days: 14
          if-no-files-found: ignore

  commit_ops:
    needs: sweep
    if: ${{ always() && needs.sweep.result != 'skipped' && github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: ops-*
          path: ${{ runner.temp }}/ops
      # Each leg started from the same committed files and appended its own run
      # line / board history; merge: tier_state = union by board key (leg
      # values win), runs.jsonl = committed lines + one new line per leg.
      - name: Merge operational files
        run: |
          python3 - <<'PY'
          import glob, json, os
          ops = os.path.join(os.environ["RUNNER_TEMP"], "ops")
          tier_p, runs_p = "data/operations/tier_state.json", "data/operations/runs.jsonl"
          tier = json.load(open(tier_p)) if os.path.exists(tier_p) else {}
          have = set(open(runs_p).read().splitlines()) if os.path.exists(runs_p) else set()
          new_lines = []
          for d in sorted(glob.glob(ops + "/*")):
              t = os.path.join(d, "tier_state.json")
              if os.path.exists(t):
                  tier.update(json.load(open(t)))
              r = os.path.join(d, "runs.jsonl")
              if os.path.exists(r):
                  lines = [l for l in open(r).read().splitlines() if l.strip()]
                  if lines and lines[-1] not in have:
                      new_lines.append(lines[-1])
          json.dump(tier, open(tier_p, "w"), indent=1)
          if new_lines:
              with open(runs_p, "a") as fh:
                  fh.write("\n".join(new_lines) + "\n")
          print("merged tier boards=%d, new run lines=%d" % (len(tier), len(new_lines)))
          PY
      - name: Commit operational files
        run: |
          set -euo pipefail
          git config user.name  "opportunity-lake-bot"
          git config user.email "bot@users.noreply.github.com"
          FILES=(data/operations/runs.jsonl data/operations/tier_state.json)
          TMP=$(mktemp -d)
          for p in "${FILES[@]}"; do mkdir -p "$TMP/$(dirname "$p")"; cp -a "$p" "$TMP/$p"; done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard HEAD
            git checkout -B ci-save origin/main
            for p in "${FILES[@]}"; do cp -a "$TMP/$p" "$p"; done
            git add -A -- "${FILES[@]}"
            if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
            git commit -m "daily: jobs sweep (matrix) $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1

  read_pages:
    needs: sweep
    if: >
      always() &&
      (needs.sweep.result == 'success' || needs.sweep.result == 'skipped') &&
      (
        (github.event_name == 'schedule' &&
         github.event.schedule == '37 2 * * *') ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.job == 'read_pages' || github.event.inputs.job == 'both'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # read_pages.py is mechanism 2 (the AI page reader) — see adapters/extractors.py.
      # It needs an LLM configured via XLAKE_LLM_API_KEY / XLAKE_LLM_MODEL /
      # XLAKE_LLM_ENDPOINT. None of those secrets exist in this repo yet
      # (engine currently runs in fixture/test mode only, per README.md), so
      # this job is wired up and scheduled but will no-op or fall back to
      # fixtures until those secrets are added — that is expected, not a bug.
      - name: Read queued company pages
        env:
          LAKE_LIMIT: ${{ github.event.inputs.limit || '0' }}
          XLAKE_LLM_API_KEY: ${{ secrets.XLAKE_LLM_API_KEY }}
          XLAKE_LLM_MODEL: ${{ secrets.XLAKE_LLM_MODEL }}
          XLAKE_LLM_ENDPOINT: ${{ secrets.XLAKE_LLM_ENDPOINT }}
        run: |
          if [ -z "$XLAKE_LLM_API_KEY" ]; then
            echo "no XLAKE_LLM_API_KEY secret set — page reader has no model configured, skipping run"
            exit 0
          fi
          python3 -u -m pipeline.read_pages

      - name: Commit page-reader state
        run: |
          set -euo pipefail
          git config user.name  "opportunity-lake-bot"
          git config user.email "bot@users.noreply.github.com"
          shopt -s nullglob
          FILES=(
            data/operations/pagereader_rows.json
            data/operations/pagereader_state.json
          )
          TMP=$(mktemp -d)
          paths=()
          for f in "${FILES[@]}"; do
            for p in $f; do
              if [ -e "$p" ]; then
                mkdir -p "$TMP/$(dirname "$p")"
                cp -a "$p" "$TMP/$p"
                paths+=("$p")
              fi
            done
          done
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard HEAD
            if [ "${#paths[@]}" -gt 0 ]; then
              git clean -fd -- "${paths[@]}"
            fi
            git checkout -B ci-save origin/main
            while IFS= read -r p; do
              p=${p#./}
              mkdir -p "$(dirname "$p")"
              cp -a "$TMP/$p" "$p"
            done < <(cd "$TMP" && find . -type f)
            if [ "${#paths[@]}" -gt 0 ]; then
              git add -A -- "${paths[@]}"
            fi
            if git diff --cached --quiet; then
              echo 'nothing to commit'
              exit 0
            fi
            git commit -m "read_pages: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt*5))
          done
          exit 1
