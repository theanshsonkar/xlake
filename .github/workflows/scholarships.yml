name: scholarships

on:
  schedule:
    - cron: "26 3 * * *"
  workflow_dispatch:
    inputs:
      retire_force:
        description: "Comma-separated categories allowed to bypass the retirement/drop guards"
        required: false
        type: string
        default: ''
      dry_run:
        description: "Collect only: no S3 write, publish or commit"
        required: false
        type: boolean
        default: false
      d1_cleanup:
        description: "D1 one-time cleanup of rows excluded by the serving filter"
        required: false
        type: boolean
        default: false
      generate_seeds:
        description: "Regenerate hub seeds first"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/_category.yml
    with:
      category: scholarships
      timeout: 40
      retire_force: ${{ inputs.retire_force || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      d1_cleanup: ${{ inputs.d1_cleanup || false }}
      generate_seeds: ${{ inputs.generate_seeds || false }}
    secrets: inherit
