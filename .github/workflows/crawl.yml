name: crawl

# General crawler, run in parallel legs. Output: the workflow ARTIFACT always. The S3
# archive (lake/crawler/runs/<ts>/) and the D1 `pages` table (in xlake-community) are written only
# when the repo variable CRAWL_PUBLISH_LIVE is 'true' (scheduled runs, or manual runs
# with publish=live); otherwise the publish job is a dry run. No Supabase, no commits.
# D1 budget: 4 runs/day x 4000 writes = 16k of the ~20k/day headroom left under the
# 80k daily check.
#
# - robots.txt is always honoured; polite per-site delays come from core.webfetch;
#   LinkedIn / Naukri are never fetched (deny list).
# - Stage 1 "seeds": crawl only seed/feed hosts, everything else stays queued in the
#   saved frontier. Stage 2 "legs": 8 machines, each crawls one frontier part (hash of
#   the registered domain), so a site lives in exactly one leg and a crash loses one
#   leg only. Stage 3 "merge": combine whatever leg artifacts exist.
# - Daily at 20:23 UTC, plus manual dispatch. The crawler has MEMORY: the merged
#   frontier is saved in the actions cache (engine/out/memory, key crawl-memory-<run>)
#   and restored by the next run's seeds stage, which re-queues feeds, budget-skipped
#   items and stale opportunity pages (liveness re-check), then spreads to new sites
#   through off-site opportunity links.
on:
  schedule:
    - cron: "23 2,8,14,20 * * *"   # every 6 hours; per-site caps per run keep it polite
  workflow_dispatch:
    inputs:
      seed_pages:
        description: "Pages for the seeds stage"
        required: false
        default: "1500"
      leg_pages:
        description: "Pages per leg"
        required: false
        default: "3000"
      workers:
        description: "Fetch workers per job"
        required: false
        default: "6"
      publish:
        description: "dry | live"
        required: false
        default: "dry"

concurrency:
  group: xlake-crawler
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore crawler memory
        uses: actions/cache/restore@v4
        with:
          path: engine/out/memory
          key: crawl-memory-${{ github.run_id }}
          restore-keys: crawl-memory-

      - name: Crawl seed and feed hosts
        env:
          SEED_PAGES: ${{ github.event.inputs.seed_pages || '1500' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: >
          python3 -u -m pipeline.crawl --seeds-only --parts 8
          --max-pages "$SEED_PAGES" --workers "$WORKERS" --max-minutes 50
          --frontier-in out/memory --out out/seeds

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-seeds
          path: engine/out/seeds
          retention-days: 14

  legs:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: crawl-seeds
          path: engine/out/seeds

      - name: Crawl this leg's part
        env:
          PART: ${{ matrix.part }}
          LEG_PAGES: ${{ github.event.inputs.leg_pages || '3000' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
        run: >
          python3 -u -m pipeline.crawl --parts 8 --part "$PART"
          --frontier-in out/seeds --no-prepare
          --max-pages "$LEG_PAGES" --workers "$WORKERS" --max-minutes 105
          --out "out/leg-$PART"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawl-leg-${{ matrix.part }}
          path: engine/out/leg-${{ matrix.part }}
          retention-days: 14
          if-no-files-found: ignore

  merge:
    needs: [seeds, legs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: crawl-leg-*
          path: engine/out/legs
          merge-multiple: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: crawl-seeds
          path: engine/out/seeds

      - name: Merge
        run: |
          mkdir -p out/legs out/seeds
          python3 -m pipeline.crawl_merge --in out/seeds out/legs/* --out out/result --parts 8

      - name: Stage memory for the next run
        run: |
          mkdir -p out/memory
          if ls out/result/frontier/*.jsonl >/dev/null 2>&1; then
            cp out/result/frontier/*.jsonl out/memory/
          fi

      - name: Save crawler memory
        if: hashFiles('engine/out/memory/*.jsonl') != ''
        uses: actions/cache/save@v4
        with:
          path: engine/out/memory
          key: crawl-memory-${{ github.run_id }}

      - name: Job summary
        run: |
          {
            echo '### crawl result'
            echo '```json'
            cat out/result/summary.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: crawl-result
          path: engine/out/result
          retention-days: 30

  publish:
    needs: [merge]
    if: always() && needs.merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    env:
      LIVE: "${{ vars.CRAWL_PUBLISH_LIVE == 'true' && (github.event_name == 'schedule' || github.event.inputs.publish == 'live') }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: crawl-result
          path: engine/out/result

      - name: Archive run to S3
        if: env.LIVE == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_DEFAULT_REGION: ap-south-1
        run: |
          TS=$(date -u +%Y-%m-%dT%H%MZ)
          for f in pages-merged.jsonl startups.jsonl summary.json; do
            gzip -kf "out/result/$f"
            aws s3 cp "out/result/$f.gz" "s3://$AWS_S3_BUCKET/lake/crawler/runs/$TS/$f.gz"
          done

      - name: Restore pending pages
        uses: actions/cache/restore@v4
        with:
          path: engine/out/pending
          key: crawl-pending-${{ github.run_id }}
          restore-keys: crawl-pending-

      - name: Sync pages to Cloudflare D1 (pages table in xlake-community)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "3dcdbb176253427b2e7e80c6189b12ca"
        run: |
          DRY="--dry-run"
          if [ "$LIVE" = "true" ]; then DRY=""; fi
          mkdir -p out/pending
          python3 -u -m pipeline.sync_pages_d1 --in out/result --max-writes 4000 --pending out/pending $DRY | tee out/pages-sync.log
          {
            echo '### pages sync (xlake-community.pages)'
            grep '^pages sync:' out/pages-sync.log | tail -1 || echo 'no summary'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save pending pages
        if: env.LIVE == 'true' && hashFiles('engine/out/pending/*') != ''
        uses: actions/cache/save@v4
        with:
          path: engine/out/pending
          key: crawl-pending-${{ github.run_id }}
