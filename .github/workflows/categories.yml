name: categories

# MANUAL "run all" dispatcher. There is no schedule here any more: each
# category has its own scheduled workflow (hackathons.yml, fellowships.yml,
# ...) that calls _category.yml. Weekly hub seeds live in hub-seeds.yml.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "Which category to run (all = every sharded category)"
        required: false
        type: choice
        default: all
        options:
          - all
          - hackathons
          - fellowships
          - scholarships
          - grants
          - research
          - open_source
          - startup
          - community
      retire_force:
        description: "Comma-separated categories allowed to bypass the retirement/drop guards"
        required: false
        type: string
        default: ''
      dry_run:
        description: "Collect only: no S3 write, publish or commit"
        required: false
        type: boolean
        default: false
      generate_seeds:
        description: "Regenerate hub seeds first"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          t = {"hackathons": 20, "fellowships": 25, "scholarships": 25, "grants": 25,
               "research": 25, "open_source": 25, "startup": 25, "community": 25}
          sel = "${{ inputs.category }}"
          inc = [{"category": c, "timeout": m} for c, m in t.items() if sel in ("all", c)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_category.yml
    with:
      category: ${{ matrix.category }}
      timeout: ${{ matrix.timeout }}
      retire_force: ${{ inputs.retire_force }}
      dry_run: ${{ inputs.dry_run }}
      generate_seeds: ${{ inputs.generate_seeds }}
    secrets: inherit
